name: Deploy Shitu to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "index.html"
      - "styles.css"
      - "job_finder.js"
      - "site_config.js"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.build-site.outputs.configured }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Test frontend
        run: node tests/test_job_finder.js
      - name: Build site
        id: build-site
        env:
          SHITU_API_BASE_URL: ${{ vars.SHITU_API_BASE_URL }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          api_url = os.environ.get("SHITU_API_BASE_URL", "").rstrip("/")
          if not re.fullmatch(r"https://[a-z0-9-]+\.onrender\.com", api_url):
              print(
                  "::warning::GitHub Pages deploy skipped: configure "
                  "SHITU_API_BASE_URL with the deployed Render API URL."
              )
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output_file:
                  output_file.write("configured=false\n")
              raise SystemExit(0)

          output = Path("site")
          output.mkdir()
          for name in ("index.html", "styles.css", "job_finder.js"):
              (output / name).write_bytes(Path(name).read_bytes())
          (output / "site_config.js").write_text(
              "window.SHITU_API_BASE_URL = "
              + json.dumps(api_url)
              + ";\n",
              encoding="utf-8",
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output_file:
              output_file.write("configured=true\n")
          PY
      - name: Upload Pages artifact
        if: steps.build-site.outputs.configured == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: needs.build.outputs.configured == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
